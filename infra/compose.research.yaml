# Preparation profile only. Business routes and migrations remain closed pending approval.
name: taiji-research-preparation
services:
  research-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taiji_research
      POSTGRES_USER: taiji_research
      POSTGRES_PASSWORD: ${RESEARCH_POSTGRES_PASSWORD:?set a separate research password}
    volumes:
      - research_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiji_research -d taiji_research"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [research_private]

  research-backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://taiji_research:${RESEARCH_POSTGRES_PASSWORD}@research-db:5432/taiji_research
      APP_PROFILE: research
      APP_ENV: research
      ALLOW_SYNTHETIC_ONLY: "false"
      SESSION_SECRET: ${RESEARCH_SESSION_SECRET:?set a separate research secret}
      APP_PUBLIC_URL: ${RESEARCH_APP_PUBLIC_URL:?set approved research origin}
    depends_on:
      research-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"
    networks: [research_private]

networks:
  research_private:

volumes:
  research_pgdata:
