[project]
name = "taiji-rehab-ml"
version = "0.1.0"
description = "Synthetic-only offline dataset quality and split tooling"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
