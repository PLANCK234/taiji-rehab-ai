name: bootstrap-ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taiji_eng04
          POSTGRES_USER: taiji
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taiji -d taiji_eng04"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://taiji:synthetic-ci-only@localhost:5432/taiji_eng04
      APP_ENV: test
      ALLOW_SYNTHETIC_ONLY: 'true'
      APP_PUBLIC_URL: http://localhost:3000
      SESSION_SECRET: synthetic-ci-integration-secret-32-characters
      ENG04_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run python -m app.export_openapi
      - run: git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify isolated browser cleanup contract
        run: python -m unittest discover -s scripts -p 'test_run_eng04b_browser.py'
      - name: ENG-04K controlled synthetic upload probe
        run: |
          mkdir -p exports
          mkdir exports/eng04b-eng04k-probe
          printf 'stage: controlled upload probe\nerror_type: SyntheticProbe\n' > exports/eng04b-eng04k-probe/failure.txt
          exit 1
      - name: Run isolated synthetic PostgreSQL browser flow
        run: python scripts/run_eng04b_browser.py
      - name: Upload synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: synthetic-browser-failure
          path: exports/eng04b-*/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/check_handoff.py
